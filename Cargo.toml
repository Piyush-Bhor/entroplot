[package]
name = "entroplot"
version = "0.1.0"
edition = "2024"
authors = ["Piyush Bhor <piyushbhor22@gmail.com>"]
license = "GPL"
description = "A Rust tool for visualizing entropy in files"
readme = "README.md"
homepage = "https://github.com/Piyush-Bhor/entroplot"
repository = "https://github.com/Piyush-Bhor/entroplot"
keywords = ["entropy", "security", "visualization", "analysis"]
categories = ["command-line-utilities", "visualization"]


[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
entropy = "0.4.2"
plotters = "0.3.3"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
